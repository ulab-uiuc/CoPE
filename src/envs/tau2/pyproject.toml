[project]
name = "agentenv_tau2"
version = "0.0.1"
description = "AgentGym env server wrapping tau2-bench's AgentGymEnv"
dependencies = ["uvicorn", "fastapi", "pydantic", "gymnasium"]
requires-python = ">=3.12"
license = {text = "MIT"}

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

# scripts/run_tau2_env_service.sh starts the server through this entry point.
[project.scripts]
tau2-env = "agentenv_tau2:launch"

[tool.pdm.build]
includes = ["agentenv_tau2"]
